<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace TechStore - Simulacro</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/main.js" defer></script>
</head>
<body>
    <!-- TODO: Aplicar clases de tema dinámicamente -->
    <div class="dashboard">
        <!-- Encabezado -->
        <header class="header">
            <h1 id="page-title">🛒 TechStore Marketplace</h1>
            <div id="notification-area">
                <!-- Notificaciones dinámicas aparecerán aquí -->
            </div>
        </header>

        <div class="main-container">
            <!-- Panel de Control Izquierdo -->
            <section id="control-panel">
                <!-- TODO: Crear todo con JavaScript -->
            </section>

            <!-- Área Principal de Productos -->
            <main id="products-area">
                <h2>📦 Catálogo de Productos</h2>
                <div id="products-grid">
                    <!-- Las cards de productos aparecerán aquí -->
                </div>
            </main>

            <!-- Carrito de Compras (derecha) -->
            <aside id="cart-sidebar">
                <h3>🛍️ Mi Carrito</h3>
                <div id="cart-items">
                    <!-- Items del carrito aparecerán aquí -->
                </div>
                <div id="cart-summary">
                    <!-- Resumen del carrito -->
                </div>
            </aside>
        </div>

        <!-- Botón oculto para funcionalidad extra -->
        <button id="export-data" style="display:none;">Exportar Datos</button>
    </div>

    
</body>
</html>
