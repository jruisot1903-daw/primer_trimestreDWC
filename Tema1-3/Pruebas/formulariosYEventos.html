<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormulariosYEventos</title>
    <link rel="stylesheet" href="./css/formulariosYEventos.css">
    <script src="./js/formulariosYEventos.js" defer></script>
</head>
<body>
      <main>
        <h3 id="info"></h3>
        <form action="" id="f1">
            <label for="login">Login</label>
            <input type="text" name="login" id="login">
            <br>
            <label for="lista">Selecciona paises en los que has vivido:</label>
            <br>
            <select id="lista">
                <option value=""></option>
                <option value="es">España</option>
                <option value="ar">Argentina</option>
                <option value="en" selected>Inglaterra</option>
                <option value="fr">Francia</option>
                <option value="it">Italia</option>
            </select>
            <br>
            <label for=""><input type="radio" name="turnos" value="tm" id=""> Turno de mañana</label>
            <br>
            <label for=""><input type="radio" name="turnos" value="tt" id=""> Turno de tarde</label>
            <br>
            <label for=""><input type="radio" name="turnos" value="tn" id="" checked> Turno de noche</label>
            <!--Barras de progreso-->
            <label for="progreso">Progreso:</label>
            <progress id="progress1" value="0" max="100"></progress>
            <meter id="meter1" max="100" min="0" optimum ="50" high="80" value="50"></meter>
            <input type=range min="0" max="100">
            <br><br>
            <input type="submit" id="bEnviar" value="Enviar">
        </form>




    </main>
</body>
</html>
