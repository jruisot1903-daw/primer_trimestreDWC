<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pruebas DOM</title>
    <link rel="stylesheet" href="css/styleDOM.css">
    <script src="js/mainDOM.js" defer></script>
</head>
<body>
     <main>
        <h3 id="info">Primero</h3>
        <input type="text" name="" id="login" placeholder="Login">
        <input type="password" name="" id="password" placeholder="Password">
        <hr>

       <label for="">OP 1</label>
       <input type="radio" name="opciones" value="1">
       <label for="">OP 2</label>
       <input type="radio" name="opciones" value="2">
       <label for="">OP 3</label>
       <input type="radio" name="opciones" value="3">
       <label for="">OP 4</label>
       <input type="radio" name="opciones" value="4">

       <br>

       <label for="">Tecnología</label>
       <input type="checkbox" name="opciones2" value="tec">
        <label for="">Deportes</label>
       <input type="checkbox" name="opciones2" value="dep">
       <label for="">Cine</label>
       <input type="checkbox" name="opciones2" value="cine">

       <hr>

       <button id="check">Check</button>
       <hr>

       <ul>
        <li>Perrito</li>
        <li>Gatito</li>
        <li>Elefante</li>
        <li>Serpiente</li>
        <li>Salmón</li>
       </ul>

        <input type="text" id="opcionLista">
    </main>
</body>
</html>
